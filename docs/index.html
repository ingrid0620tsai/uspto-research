<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USPTO Patent Letter Research</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .card h2 {
            color: #333;
            margin-bottom: 12px;
            font-size: 1.4rem;
        }
        .card p {
            color: #666;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USPTO Patent Letter Research</h1>
        <div class="card-container">
            <a href="patent_letter_framework.html" class="card">
                <div class="card-icon">📄</div>
                <h2>Patent Letter Framework</h2>
                <p>USPTO 專利意見書研究框架與分析結果，包含 Comment Letter 資料分析與視覺化呈現。</p>
            </a>
            <a href="regression_framework.html" class="card">
                <div class="card-icon">📊</div>
                <h2>Regression Model Framework</h2>
                <p>Compustat 迴歸模型分析框架，包含統計分析結果與迴歸係數視覺化。</p>
            </a>
        </div>
        <div class="footer">
            <p>Lien Lab Research &copy; 2026</p>
        </div>
    </div>
</body>
</html>
